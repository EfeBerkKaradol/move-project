spring:
  modulith:
    events:
      # Dinleyici düşerse (örn. Keycloak kapalı) olay tamamlanmamış kalır; açılışta yeniden denenir
      republish-outstanding-events-on-restart: true
  config:
    # services/api/.env varsa okunur (KEY=VALUE). Yoksa sessizce atlanır; üretimde
    # değerler gerçek ortam değişkenlerinden gelir. Şablon: .env.example
    import: optional:file:.env[.properties]
  application:
    name: tasiyoruz-api
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  servlet:
    multipart:
      # Belge yükleme sınırı DocumentUploadPolicy'de 8 MB. Sunucu sınırı ondan büyük
      # olmalı: küçük olsaydı Spring isteği okumadan reddeder ve kullanıcı, politikanın
      # yazdığı anlaşılır Türkçe mesaj yerine ham 413 görürdü.
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    # Neon/üretim: DATABASE_URL'i JDBC biçiminde ver —
    # jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tasiyoruz}
    username: ${DATABASE_USERNAME:tasiyoruz}
    password: ${DATABASE_PASSWORD:tasiyoruz}
  jpa:
    hibernate:
      ddl-auto: validate      # şemayı Flyway yönetir, Hibernate değil
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      # Tek satırda adres. Upstash gibi TLS'li sağlayıcılarda şema rediss://
      # olur ve parola URL'in içinde gelir:
      #   REDIS_URL=rediss://default:<parola>@<host>:6379
      # Boş string Spring'i kırdığı için varsayılan da tam URL.
      url: ${REDIS_URL:redis://localhost:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak'ın herkese açık adresi. Render'da servis adresi buraya
          # otomatik geliyor; realm yolunu biz ekliyoruz.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081}/realms/${KEYCLOAK_REALM:tasiyoruz}

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

tasiyoruz:
  quote:
    # Teklif imzası. Local varsayılanı güvenli DEĞİL; üretimde zorunlu (ANAHTARLAR #13)
    signing-secret: ${TASIYORUZ_QUOTE_SIGNING_SECRET:local-development-secret}
  cors:
    # Web uygulamasının origin'leri, virgülle (ANAHTARLAR #14)
    allowed-origins: ${TASIYORUZ_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  maps:
    # Google Maps Platform (ANAHTARLAR #1). Boşsa takribî rota sağlayıcısı devrede.
    api-key: ${GOOGLE_MAPS_API_KEY:}
  notification:
    # E-postadaki bağlantıların kökü ve gönderen adresi. Yerelde Mailhog (localhost:1025,
    # arayüz http://localhost:8025); üretimde gerçek SMTP spring.mail.* ile (ANAHTARLAR #20).
    from: ${NOTIFICATION_FROM:no-reply@tasiyoruz.local}
    site-url: ${NEXT_PUBLIC_SITE_URL:http://localhost:3000}
    enabled: ${NOTIFICATION_ENABLED:true}
  keycloak:
    admin:
      # Servis hesaplı istemci (realm'de tasiyoruz-api). Onaylanan taşıyıcıya DRIVER
      # rolü vermek ve bildirim için e-posta okumak üzere yönetim API'si çağrılıyor.
      # Gizli anahtar boşsa rol eşitleme ve e-posta çözümleme kapalı (ANAHTARLAR #19).
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:tasiyoruz}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:tasiyoruz-api}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:tasiyoruz-api-dev-secret}
  storage:
    # Taşıyıcı belgeleri için S3 uyumlu nesne deposu. Yerelde docker-compose'daki
    # MinIO; üretimde Türkiye'de barındırılan bir sağlayıcı (ANAHTARLAR #18).
    # Anahtar verilmezse belge yükleme açıkça reddeder, sessizce kaybetmez.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:tasiyoruz-belgeler}
    access-key: ${STORAGE_ACCESS_KEY:tasiyoruz}
    secret-key: ${STORAGE_SECRET_KEY:tasiyoruz123}
    # MinIO sanal-host adreslemeyi localhost'ta çözemez
    path-style: ${STORAGE_PATH_STYLE:true}
    create-bucket: ${STORAGE_CREATE_BUCKET:true}

logging:
  level:
    com.tasiyoruz: DEBUG
