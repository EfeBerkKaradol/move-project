spring:
  application:
    name: turmove-api
  datasource:
    url: jdbc:postgresql://localhost:5432/turmove
    username: turmove
    password: turmove
  jpa:
    hibernate:
      ddl-auto: validate      # şemayı Flyway yönetir, Hibernate değil
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/turmove

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

turmove:
  # Faz 0'da yer tutucu — gerçek değerler ortam değişkeninden gelir
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  storage:
    endpoint: http://localhost:9000
    bucket: turmove-local
  commission:
    # Komisyonsuz dönem — 2027 ilk çeyreğine kadar
    default-percent: 0

logging:
  level:
    com.turmove: DEBUG
