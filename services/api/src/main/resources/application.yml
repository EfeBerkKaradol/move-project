spring:
  config:
    # services/api/.env varsa okunur (KEY=VALUE). Yoksa sessizce atlanır; üretimde
    # değerler gerçek ortam değişkenlerinden gelir. Şablon: .env.example
    import: optional:file:.env[.properties]
  application:
    name: tasiyoruz-api
  datasource:
    url: jdbc:postgresql://localhost:5432/tasiyoruz
    username: tasiyoruz
    password: tasiyoruz
  jpa:
    hibernate:
      ddl-auto: validate      # şemayı Flyway yönetir, Hibernate değil
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/tasiyoruz

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

tasiyoruz:
  quote:
    # Teklif imzası. Local varsayılanı güvenli DEĞİL; üretimde zorunlu (ANAHTARLAR #13)
    signing-secret: ${TASIYORUZ_QUOTE_SIGNING_SECRET:local-development-secret}
  cors:
    # Web uygulamasının origin'leri, virgülle (ANAHTARLAR #14)
    allowed-origins: ${TASIYORUZ_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  maps:
    # Google Maps Platform (ANAHTARLAR #1). Boşsa takribî rota sağlayıcısı devrede.
    api-key: ${GOOGLE_MAPS_API_KEY:}

logging:
  level:
    com.tasiyoruz: DEBUG
