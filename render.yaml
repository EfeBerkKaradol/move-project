# Render Blueprint — Keycloak ve API'yi tek seferde kurar.
#
# Kullanımı: Render → New → Blueprint → bu repoyu seç. Aşağıda `sync: false` yazan
# değerler kuruluma başlarken sana tek tek sorulur (Neon ve Upstash bilgileri).
#
# Yorumlardaki adresler ÖRNEKTİR, olduğu gibi yapıştırılmaz — kendi panellerinden
# aldığın gerçek değerleri gir. Örnek adres girilirse servis "UnknownHostException"
# ile açılmaz.
#
# ⚠️ Ücretsiz plan 15 dakika istek gelmezse servisi uyutur; sonraki istek ~1 dakika
# bekler. Keycloak ve API için ayrı ayrı geçerli, yani ilk giriş yavaş olabilir.
# Ücretsiz plan 512 MB bellek veriyor; ikisi de bu sınırda ayarlandı.

services:
  # ── Kimlik sunucusu ────────────────────────────────────────────────
  - type: web
    name: tasiyoruz-keycloak
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/docker/keycloak/Dockerfile
    dockerContext: ./infra/docker/keycloak
    # /health/ready yönetim portunda (9000) yayınlanıyor, Render ise 8080'e bakıyor
    # ve 404 alıp servisi sağlıksız sayıyordu. Bu uç ana portta 200 dönüyor ve
    # ayrıca realm'in içe aktarıldığını da doğruluyor.
    healthCheckPath: /realms/tasiyoruz
    envVars:
      # Keycloak kendi tablolarını ayrı bir veritabanında tutmalı: API'nin Flyway
      # göçleriyle aynı şemayı paylaşırlarsa tablo adları çakışabilir.
      - key: KC_DB_URL
        # ÖRNEK (kendi Neon adresinle değiştir, ep-... kısmı sana özel):
        #   jdbc:postgresql://ep-ornek-1234.c-4.us-east-2.aws.neon.tech/keycloak?sslmode=require
        # Veritabanı adı API'ninkinden FARKLI olmalı (keycloak / neondb).
        sync: false
      - key: KC_DB_USERNAME
        sync: false
      - key: KC_DB_PASSWORD
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true    # Render üretir; Dashboard → Environment'tan okursun
      # Kendi herkese açık adresini bilmesi gerekiyor: token'lardaki issuer bundan
      # üretiliyor ve tarayıcı o adrese yönlendiriliyor.
      #
      # `fromService … property: host` KULLANILMAZ — o, iç ağ adını veriyor
      # ("tasiyoruz-keycloak"), ortaya .onrender.com'suz bir issuer çıkıyor ve
      # ne tarayıcı ne de API o adrese ulaşabiliyor. Blueprint'te herkese açık
      # adresi veren bir özellik yok, o yüzden elle yazılıyor.
      # Kendi alan adına geçince burası ve API'deki KEYCLOAK_HOST birlikte değişir.
      - key: KC_HOSTNAME
        value: tasiyoruz-keycloak.onrender.com
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HTTP_ENABLED
        value: "true"          # TLS'i Render sonlandırıyor; içeride düz HTTP
      # Keycloak iki port açıyor: 8080 uygulama, 9000 yönetim. Hangisine
      # yönlendirileceği Render'ın taramasına bırakılmıyor.
      - key: PORT
        value: "8080"
      # Yalnızca C1 derleyicisi. 0.2 CPU / 512 MB ile ölçüldüğünde açılış 219s'den
      # 139s'ye, bellek 461 MB'den 380 MB'ye indi (512 MB sınırında %90 → %74).
      # Render'ın port taraması 200 saniyeyi aşan açılışlarda vazgeçiyor.
      #
      # Buraya GC bayrağı EKLENMEZ: imaj zaten -XX:+UseG1GC veriyor, ikincisi
      # "Multiple garbage collectors selected" ile JVM'i açılışta öldürüyor.
      # TieredStopAtLevel bir GC bayrağı değil, çakışmadığı ölçülerek doğrulandı.
      - key: JAVA_OPTS_APPEND
        value: -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=50

  # ── API ────────────────────────────────────────────────────────────
  - type: web
    name: tasiyoruz-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        # ÖRNEK: jdbc:postgresql://ep-ornek-1234.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
        # 'jdbc:' öneki şart; Neon'un verdiği postgresql://... doğrudan çalışmaz.
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: REDIS_URL
        # ÖRNEK: rediss://default:AbC123@ornek-12345.upstash.io:6379
        # Şema çift s olmalı; TLS oradan okunuyor.
        sync: false
      # Keycloak'ın herkese açık adresi; API ikisini birleştirip
      # https://tasiyoruz-keycloak.onrender.com/realms/tasiyoruz üretiyor.
      # Bu, Keycloak'ın KC_HOSTNAME'iyle BİREBİR aynı olmalı — token'daki issuer
      # ile API'nin beklediği issuer eşleşmezse her istek 401 döner.
      - key: KEYCLOAK_HOST
        value: tasiyoruz-keycloak.onrender.com
      - key: KEYCLOAK_SCHEME
        value: https
      - key: KEYCLOAK_ADMIN_CLIENT_SECRET
        sync: false            # Keycloak → Clients → tasiyoruz-api → Credentials
      # Tomcat 8080'i dinliyor; Render'ın taramasına bırakmak yerine açıkça söylüyoruz.
      - key: PORT
        value: "8080"
      - key: TASIYORUZ_QUOTE_SIGNING_SECRET
        generateValue: true
      - key: TASIYORUZ_CORS_ALLOWED_ORIGINS
        sync: false            # ÖRNEK: https://move-project-web.vercel.app
      - key: NEXT_PUBLIC_SITE_URL
        sync: false            # ÖRNEK: https://move-project-web.vercel.app (e-postalardaki bağlantılar)
      # Dosya deposu ve SMTP henüz yoksa boş bırak: belge yükleme ve bildirim
      # açıkça "yapılandırılmamış" der, uygulama yine açılır.
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      # Gönderen adresi. Girilmezse varsayılanı no-reply@tasiyoruz.local — sahte bir
      # alan adı; sağlayıcı doğrulanmamış göndericiyi reddeder ve bildirimler sessizce
      # FAILED olur. Sağlayıcıda doğruladığın adresin AYNISI yazılmalı.
      - key: NOTIFICATION_FROM
        sync: false            # ÖRNEK: bildirim@karinca.tech
      # Posta sağlayıcısının HTTP API anahtarı. Render ücretsiz planda giden SMTP
      # portlarını (25/465/587) kapatıyor; bu anahtar verildiğinde gönderim 443
      # üzerinden yapılıyor ve aşağıdaki SMTP_* değerleri kullanılmıyor.
      # DİKKAT: SMTP anahtarı değil, hesabın API anahtarı — Brevo'da ayrı sekme.
      - key: TASIYORUZ_MAIL_API_KEY
        sync: false            # Brevo → SMTP & API → API keys
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
