# Render Blueprint — Keycloak ve API'yi tek seferde kurar.
#
# Kullanımı: Render → New → Blueprint → bu repoyu seç. Aşağıda `sync: false` yazan
# değerler kuruluma başlarken sana tek tek sorulur (Neon ve Upstash bilgileri).
#
# ⚠️ Ücretsiz plan 15 dakika istek gelmezse servisi uyutur; sonraki istek ~1 dakika
# bekler. Keycloak ve API için ayrı ayrı geçerli, yani ilk giriş yavaş olabilir.
# Ücretsiz plan 512 MB bellek veriyor; ikisi de bu sınırda ayarlandı.

services:
  # ── Kimlik sunucusu ────────────────────────────────────────────────
  - type: web
    name: tasiyoruz-keycloak
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/docker/keycloak/Dockerfile
    dockerContext: ./infra/docker/keycloak
    # /health/ready yönetim portunda (9000) yayınlanıyor, Render ise 8080'e bakıyor
    # ve 404 alıp servisi sağlıksız sayıyordu. Bu uç ana portta 200 dönüyor ve
    # ayrıca realm'in içe aktarıldığını da doğruluyor.
    healthCheckPath: /realms/tasiyoruz
    envVars:
      # Keycloak kendi tablolarını ayrı bir veritabanında tutmalı: API'nin Flyway
      # göçleriyle aynı şemayı paylaşırlarsa tablo adları çakışabilir.
      - key: KC_DB_URL
        sync: false            # jdbc:postgresql://<neon-host>/keycloak?sslmode=require
      - key: KC_DB_USERNAME
        sync: false
      - key: KC_DB_PASSWORD
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true    # Render üretir; Dashboard → Environment'tan okursun
      # Kendi adresini bilmesi gerekiyor; Render servis adresini buraya kendi koyuyor
      - key: KC_HOSTNAME
        fromService:
          type: web
          name: tasiyoruz-keycloak
          property: host
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HTTP_ENABLED
        value: "true"          # TLS'i Render sonlandırıyor; içeride düz HTTP
      # Keycloak iki port açıyor: 8080 uygulama, 9000 yönetim. Hangisine
      # yönlendirileceği Render'ın taramasına bırakılmıyor.
      - key: PORT
        value: "8080"
      # Yalnızca C1 derleyicisi. 0.2 CPU / 512 MB ile ölçüldüğünde açılış 219s'den
      # 139s'ye, bellek 461 MB'den 380 MB'ye indi (512 MB sınırında %90 → %74).
      # Render'ın port taraması 200 saniyeyi aşan açılışlarda vazgeçiyor.
      #
      # Buraya GC bayrağı EKLENMEZ: imaj zaten -XX:+UseG1GC veriyor, ikincisi
      # "Multiple garbage collectors selected" ile JVM'i açılışta öldürüyor.
      # TieredStopAtLevel bir GC bayrağı değil, çakışmadığı ölçülerek doğrulandı.
      - key: JAVA_OPTS_APPEND
        value: -XX:TieredStopAtLevel=1

  # ── API ────────────────────────────────────────────────────────────
  - type: web
    name: tasiyoruz-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false            # jdbc:postgresql://<neon-host>/neondb?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false            # rediss://default:<parola>@<host>:6379
      # Render host'u şemasız veriyor ("x.onrender.com"); şemayı ayrıca söylüyoruz.
      # API ikisini birleştirip https://x.onrender.com/realms/tasiyoruz üretiyor.
      - key: KEYCLOAK_HOST
        fromService:
          type: web
          name: tasiyoruz-keycloak
          property: host
      - key: KEYCLOAK_SCHEME
        value: https
      - key: KEYCLOAK_ADMIN_CLIENT_SECRET
        sync: false            # Keycloak → Clients → tasiyoruz-api → Credentials
      # Tomcat 8080'i dinliyor; Render'ın taramasına bırakmak yerine açıkça söylüyoruz.
      - key: PORT
        value: "8080"
      - key: TASIYORUZ_QUOTE_SIGNING_SECRET
        generateValue: true
      - key: TASIYORUZ_CORS_ALLOWED_ORIGINS
        sync: false            # https://<vercel-adresin>
      - key: NEXT_PUBLIC_SITE_URL
        sync: false            # https://<vercel-adresin> — e-postalardaki bağlantılar
      # Dosya deposu ve SMTP henüz yoksa boş bırak: belge yükleme ve bildirim
      # açıkça "yapılandırılmamış" der, uygulama yine açılır.
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
