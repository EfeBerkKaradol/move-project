name: tasiyoruz

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tasiyoruz-postgres
    environment:
      POSTGRES_USER: tasiyoruz
      POSTGRES_PASSWORD: tasiyoruz
      POSTGRES_DB: tasiyoruz
    ports: ["5432:5432"]
    volumes:
      - tasiyoruz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasiyoruz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tasiyoruz-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - tasiyoruz_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tasiyoruz-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

  minio:
    image: minio/minio:latest
    container_name: tasiyoruz-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: tasiyoruz
      MINIO_ROOT_PASSWORD: tasiyoruz123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - tasiyoruz_minio:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tasiyoruz-mailhog
    ports: ["1025:1025", "8025:8025"]

volumes:
  tasiyoruz_pg:
  tasiyoruz_redis:
  tasiyoruz_minio:
