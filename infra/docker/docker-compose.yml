name: turmove

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: turmove-postgres
    environment:
      POSTGRES_USER: turmove
      POSTGRES_PASSWORD: turmove
      POSTGRES_DB: turmove
    ports: ["5432:5432"]
    volumes:
      - turmove_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turmove"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: turmove-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - turmove_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: turmove-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

  minio:
    image: minio/minio:latest
    container_name: turmove-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: turmove
      MINIO_ROOT_PASSWORD: turmove123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - turmove_minio:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: turmove-mailhog
    ports: ["1025:1025", "8025:8025"]

volumes:
  turmove_pg:
  turmove_redis:
  turmove_minio:
