parent=keycloak.v2
import=common/keycloak

# Sondaki ?v= elle artırılan bir önbellek kırıcı.
#
# Keycloak stil adreslerine kendi sürüm damgasını koyuyor (/resources/<damga>/...)
# ama bu damga Keycloak sürümüne bağlı; temayı değiştirince değişmiyor. Sonuç:
# giriş sayfasını daha önce açmış kullanıcılar eski CSS'i önbellekten alıyor ve
# tema güncellemesi onlara hiç ulaşmıyor. Bu dosyada CSS değiştiğinde sayıyı artır.
styles=css/styles.css css/tasiyoruz.css?v=3

# Marka arka planı PatternFly'ın kendi görselini ezdiği için logo bloğu gizleniyor;
# başlığı kendi CSS'imiz basıyor (::before ile), şablon override'ı gerekmiyor.
kcLogoLink=/
